# Temporary: timeline of the box following TextEdit on macOS. Run from the Actions tab.
name: macOS follow timeline
on: workflow_dispatch
jobs:
  timeline:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices
      - run: python tests/macos_follow_timeline.py
