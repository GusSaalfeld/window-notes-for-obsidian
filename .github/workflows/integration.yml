# Runs the full fail-state test (tests/integration.py) on a real desktop on each system.
# It runs on every push to main, and from the Actions tab ("Run workflow").
name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install comtypes
      - name: Handle obsidian:// links silently (no Obsidian here; otherwise Windows pops up a "how do you want to open this?" dialog that steals focus mid-test)
        shell: pwsh
        run: |
          $py = (Get-Command pythonw).Source
          reg add HKCU\Software\Classes\obsidian /ve /d "URL:obsidian" /f
          reg add HKCU\Software\Classes\obsidian /v "URL Protocol" /d "" /f
          reg add HKCU\Software\Classes\obsidian\shell\open\command /ve /d "`"$py`" -c pass" /f
      - run: python tests/integration.py

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk, python-xlib and a virtual X11 desktop
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk python3-xlib xvfb openbox xdotool
      - name: Handle obsidian:// links silently (otherwise the browser opens and takes focus mid-test)
        run: |
          mkdir -p ~/.local/share/applications
          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=No-op"
            echo "Exec=true %u"
            echo "MimeType=x-scheme-handler/obsidian;"
          } > ~/.local/share/applications/obsidian-noop.desktop
          xdg-mime default obsidian-noop.desktop x-scheme-handler/obsidian
          xdg-mime query default x-scheme-handler/obsidian
      - name: Run on Xvfb + Openbox
        run: |
          Xvfb :99 -screen 0 1600x1000x24 & sleep 1
          DISPLAY=:99 openbox & sleep 1
          DISPLAY=:99 python3 tests/integration.py

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices
      - run: python tests/integration.py
