# Copy this file to config.toml and edit it (or just start Window Notes:
# on first run it asks for your vault folder and writes config.toml for you).

# Your Obsidian vault, or any folder of Markdown notes. Use forward slashes or doubled backslashes.
vault = "C:/Users/you/Documents/My Vault"

# Folder inside the vault where attached notes live. Subfolders are read too.
folder = "Window notes"

# Ctrl+Alt+<this key> attaches a new note to the active window.
hotkey = "N"

# How solid notes are when the mouse isn't over them: 1.0 = solid, 0.5 = half see-through.
# Also settable with right-click -> Opacity.
opacity = 1.0
